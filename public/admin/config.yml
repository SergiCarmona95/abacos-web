backend:
  name: git-gateway
  branch: main

media_library:
  name: cloudinary
  config:
    cloud_name: djjzvuuzh
    api_key: 998266795964365

media_folder: public/uploads
public_folder: /uploads

locale: ca

collections:
  - name: noticies
    label: Notícies
    folder: src/content/noticies
    create: true
    identifier_field: identificador
    slug: "{{identificador}}"
    fields:
      - { label: "Identificador (slug)", name: identificador, widget: string, hint: "Identificador únic sense espais ni accents. Ex: acord-jornada-2025" }
      - { label: "Títol (CA)", name: titol, widget: string }
      - { label: "Títol (ES)", name: titolEs, widget: string }
      - { label: "Data", name: data, widget: datetime, format: "DD MMM YYYY", date_format: "DD MMM YYYY", time_format: false }
      - { label: "Tag (CA)", name: tag, widget: string }
      - { label: "Tag (ES)", name: tagEs, widget: string }
      - { label: "Resum (CA)", name: resum, widget: text }
      - { label: "Resum (ES)", name: resumEs, widget: text }
      - { label: "Contingut (CA)", name: body, widget: markdown }
      - { label: "Contingut (ES)", name: bodyEs, widget: markdown, required: false }
      - { label: "URL del vídeo", name: videoUrl, widget: string, required: false, hint: "Enganxa una URL de YouTube, Instagram o Cloudinary" }
      - { label: "Mostrar vídeo", name: mostrarVideo, widget: boolean, default: true, required: false }
      - { label: "Imatge", name: imatge, widget: image, required: false }

  - name: videos
    label: Vídeos
    folder: src/content/videos
    create: true
    identifier_field: identificador
    slug: "{{identificador}}"
    fields:
      - { label: "Identificador (slug)", name: identificador, widget: string, hint: "Ex: assemblea-juny-2025" }
      - { label: "Títol (CA)", name: titol, widget: string }
      - { label: "Títol (ES)", name: titolEs, widget: string }
      - { label: "Fitxer de vídeo", name: url, widget: file, media_library: { name: cloudinary, config: { cloud_name: djjzvuuzh, api_key: 998266795964365 } } }
      - { label: "Descripció (CA)", name: descripcio, widget: text, required: false }
      - { label: "Descripció (ES)", name: descripcioEs, widget: text, required: false }
      - { label: "Mostrar a la web", name: mostrar, widget: boolean, default: true }

  - name: documents
    label: Documents
    folder: src/content/documents
    create: true
    identifier_field: identificador
    slug: "{{identificador}}"
    fields:
      - { label: "Identificador (slug)", name: identificador, widget: string, hint: "Identificador únic sense espais ni accents. Ex: acord-condicions-2024" }
      - { label: "Nom (CA)", name: nom, widget: string }
      - { label: "Nom (ES)", name: nomEs, widget: string }
      - { label: "Categoria (CA)", name: categoria, widget: select, options: ["Convenis", "Permisos i llicències", "Afiliació", "Altres"] }
      - { label: "Categoria (ES)", name: categoriaEs, widget: select, options: ["Convenios", "Permisos y licencias", "Afiliación", "Otros"] }
      - { label: "Mida", name: mida, widget: string, hint: "Ex: 2.4 MB" }
      - { label: "Fitxer PDF", name: url, widget: file, media_folder: /public/uploads/documents, public_folder: /uploads/documents }
